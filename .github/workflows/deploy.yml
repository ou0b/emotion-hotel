name: Deploy Emotion Hotel Web

on:
  push:
    branches: [ main ]

# 【直接授予寫入權限，避開 403 錯誤】
permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 下載程式碼
        uses: actions/checkout@v3

      - name: 安裝 Emscripten
        uses: mymindstorm/setup-emsdk@v12
        with:
          version: 3.1.50

      - name: 下載並編譯 raylib 網頁版
        run: |
          git clone --depth 1 https://github.com/raysan5/raylib.git raylib
          cd raylib/src
          emmake make PLATFORM=PLATFORM_WEB -B
          cd ../..

      - name: 編譯 main.c 為 WebAssembly 網頁
        run: |
          mkdir build
          RAYLIB_LIB=$(find ./raylib/src -name "libraylib*.a" | head -n 1)
          echo "Found raylib lib at: $RAYLIB_LIB"
          emcc -o build/index.html main.c \
            -Os -Wall \
            -I./raylib/src "$RAYLIB_LIB" \
            -s USE_GLFW=3 -s ASYNCIFY -s TOTAL_MEMORY=67108864 \
            -DPLATFORM_WEB \
            --preload-file word.ttf \
            --preload-file "AEROHEAD - Fragments.mp3" \
            --preload-file "Nettson - Last Promise.mp3" \
            --preload-file "Savfk - Rounding.mp3" \
            --shell-file minshell.html

      - name: 發布到 GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build
